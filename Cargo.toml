[workspace]
resolver = "2"
members = [
    "crates/autoclimb-types",
    "crates/autoclimb-discovery",
    "crates/autoclimb-graph",
    "crates/autoclimb-scoring",
    "crates/autoclimb-state",
    "crates/autoclimb-detectors",
    "crates/autoclimb-lang-python",
    "crates/autoclimb-config",
    "crates/autoclimb-output",
    "crates/autoclimb-treesitter",
    "crates/autoclimb-lang-generic",
    "crates/autoclimb-lang-typescript",
    "crates/autoclimb-fixer",
    "crates/autoclimb-review",
    "crates/autoclimb-narrative",
    "crates/autoclimb-plan",
    "crates/autoclimb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
regex = "1"
tracing = "0.1"
fs2 = "0.4"

# Internal crates
autoclimb-types = { path = "crates/autoclimb-types" }
autoclimb-discovery = { path = "crates/autoclimb-discovery" }
autoclimb-graph = { path = "crates/autoclimb-graph" }
autoclimb-scoring = { path = "crates/autoclimb-scoring" }
autoclimb-state = { path = "crates/autoclimb-state" }
autoclimb-detectors = { path = "crates/autoclimb-detectors" }
autoclimb-lang-python = { path = "crates/autoclimb-lang-python" }
autoclimb-config = { path = "crates/autoclimb-config" }
autoclimb-output = { path = "crates/autoclimb-output" }
autoclimb-treesitter = { path = "crates/autoclimb-treesitter" }
autoclimb-lang-generic = { path = "crates/autoclimb-lang-generic" }
autoclimb-lang-typescript = { path = "crates/autoclimb-lang-typescript" }
autoclimb-fixer = { path = "crates/autoclimb-fixer" }
autoclimb-review = { path = "crates/autoclimb-review" }
autoclimb-narrative = { path = "crates/autoclimb-narrative" }
autoclimb-plan = { path = "crates/autoclimb-plan" }

# Async
tokio = { version = "1", features = ["process", "time", "sync", "rt-multi-thread", "macros", "io-util"] }

# Crypto / random
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Tree-sitter
tree-sitter = "0.24"
streaming-iterator = "0.1"
tree-sitter-language = "0.1"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c = "0.23"
tree-sitter-php = "0.24"
tree-sitter-scala = "0.23"

# Text similarity
similar = "2"

# Dev dependencies
tempfile = "3"
